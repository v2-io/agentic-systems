# mono-meta.yaml — per-volume metadata for the monograph build.
#
# Schema (loose; extend as needs surface):
#   title       — full display title for the volume
#   short_title — short tag used in running heads, references, filenames
#   slug        — id used in bin/build-monograph + output filenames
#   major/minor/patch — semantic version; bin/output-version reads/writes
#   outline     — entrypoint outline file (relative to this directory);
#                 defaults to OUTLINE.md
#   cover_svg   — full-page cover image (relative to this directory);
#                 the build converts it to PDF via rsvg-convert and emits
#                 it as the cover page

title:       "AAT: Adaptation & Actuation Theory"
short_title: AAT
slug:        aat
major:       0
minor:       4
patch:       0
cover_svg:   AAT-cover.svg
