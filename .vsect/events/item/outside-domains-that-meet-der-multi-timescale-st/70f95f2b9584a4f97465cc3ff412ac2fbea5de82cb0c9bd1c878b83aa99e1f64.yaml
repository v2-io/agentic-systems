text: 'A third consumer of the open jump-process premise, with one exact piece: in the linear-Gaussian model a rare-jump component is exactly extra drift, q_eff = q + lambda_J Q_J; a jump-prone axis charges an amplitude as well as a rate (absorption precision iota_abs = 1/R^2 caps every rent); and missed jumps are an observability statement (incremental versus absolute observation operator), not an information one. The jump-drift spike refuted its own brief''s framing that the asymmetry ''falls out of the same recursion''; any canon text uses the corrected form. Demand, not corroboration, for the strengthening; scope is the known-law diagonal linear-Gaussian game. Fuller detail in item influx-rhythm-of-survival-layer.'
