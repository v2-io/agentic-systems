text: 'Strengthen route for part (3): MMO''s inequality read for cadence, r_h >= D_h ln((1 - S_c0)/(1 - s*)) / (epsilon S_h0), is a transfer (drain) floor on consolidation cadence given fast-store forgetting; it names no sleep stage and is the same inequality as the window''s upper bound in item todo-stability-upper-bound-for-form-consolida-be13. The stage driving insight is itself inconsistent across studies (REM, Cai 2009; N1, Lacaux 2021; N2, Loewe 2024; offline_counterfactual_segmentation.md Q4).'
