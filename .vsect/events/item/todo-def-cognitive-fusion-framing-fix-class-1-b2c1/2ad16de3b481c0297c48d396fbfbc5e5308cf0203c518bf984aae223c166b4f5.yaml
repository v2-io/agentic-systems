text: 'The paper''s account of the same object from the other side: the cognitive fusion is a relationally constituted entity whose thoughts and capacities exist only in the dyad; its loss is attested in humans by the breakup (''we grieve ... what we had together ... even when both live on''); it answers Shoemaker''s ''heavier end of a spectrum'' with a principle (how much fusion is lost, plus whether the other ends) and Belshaw''s intrinsic-change account by making the fusion itself the bearer. Canon''s planned definition (03-llm-core/OUTLINE.md:143, ''resonance as mutual information approaching channel capacity R_spec, forming a Class 1 macro-agent'') is information-theoretic; the paper''s is relational and harm-theoretic. They look like two faces of one object neither side has joined (my inference from the shapes); the question to ask is whether a dyad is a composite agent (#form-composition-closure, #scope-composite-agent) with capacities its parts lack. Joseph''s 2026-05-31 correction travels with it: ''brace with precedent-and-fence, never soften''. #impl-closed-loop-interiority describes the fusion in the present tense while the segment is missing.'
