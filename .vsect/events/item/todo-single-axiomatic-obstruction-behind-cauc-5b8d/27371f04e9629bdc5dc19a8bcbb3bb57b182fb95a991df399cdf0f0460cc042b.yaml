restated: 'The question is whether the two failures at the unobservable-common-cause boundary are one obstruction: the Cauchy-FE additivity failure at the update layer (#deriv-edge-update-natural-parameter:139) and the Cramér-Rao Fisher-rank deficiency at the observation layer (#disc-identifiability-floor Instance 2). Canon currently says the two routes ''converge on the same scope boundary''. That is true of this DAG, but my guess is they come apart in general, so there is no single axiom. Additivity of the update in some fixed coordinate needs a fixed-dimension sufficient statistic, which by Pitman-Koopman-Darmois means an exponential family. The rank deficiency is non-identifiability. A two-component mixture with known components and unknown weight is identifiable (Fisher information positive) yet has no fixed-dimension sufficient statistic, so additivity fails without a Cramér-Rao floor. If that witness holds, the honest canon sentence is that they coincide when the latent is a non-identifiable common cause, and the item becomes a characterization of when they coincide. My inference; the witness needs checking.'
