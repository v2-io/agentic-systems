text: 'More outside statements of the arc for B.3 and A.2 to test, none ratified, each weighed against the formalism: the ops theory history''s §8 (''the real intellectual turning points'', ''load-bearing vs decorative, as of mid-July'', ''the frontier, honestly stated''), written from primary sources, the nearest thing to an owner-level reading of ASF''s arc outside asf; the May consequential-findings digest''s selection and reading order (its statements are pre-repair: S1 and C2/S2 refuted, A5 ''the DAG is mathematically necessary'' stronger than canon''s ''principled but chosen'' at #impl-strategy-structure:21; take the selection, not the wording), and its companion''s framing of persistence as two conditions, structural persistence and task adequacy, failing for different reasons with opposite remedies (canon has the split; whether it teaches it as the headline is an A.2 question); the Longview overview as a funder-question-to-asset map, once its two misstatements are corrected (item influx-outward-claims-outrun-canon); and aat-refactored''s ''what can an agent know from the inside, and where does that knowledge stop?'', ''a theory of being wrong well'' (its author tiers it non-epistemic; the second is already INTENT''s working thesis in other words).'
