text: 'A fourth candidate statement, from the Paper 01 revision outline''s ''identity sentence'': every agent contains an adaptive tracking core, ''because agency is a narrowing of adaptation, not a departure from it'', so Part I results bind every agent by containment (the set inclusion is canon: agency scope within adaptive scope; the sentence and the inheritance claim are not, grep at cbd2f345 for ''narrowing of adaptation'', ''tracking core''). The outline adds, asserted not derived, that ''the tragedy is inherited upward with increasing force: higher agency adds drifting axes'' (own calibration, goal relevance, models of others) faster than it adds attention; canon would carry that at hypothesis tier. A companion argument for #deriv-causal-ib-lmi and #deriv-causal-ib-exploration Discussion: known drift is the favorable case, so the impossibility results hold a fortiori without that knowledge, and unknown drift adds cost only on the constructive side (''you can only detect drift on axes you glance at''). It is close to INTENT''s working thesis (''the price of that contact rises with success and with purpose'') and should be tested against it under B.3.'
