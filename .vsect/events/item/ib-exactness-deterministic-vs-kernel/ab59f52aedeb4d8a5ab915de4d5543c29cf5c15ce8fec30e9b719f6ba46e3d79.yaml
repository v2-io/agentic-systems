text: 'Same defect, found independently from the aat-refactored side: Still 2009''s with-actions IB assumes P(s, a | h) = P(s | h) P(a | h) (eq. 1), exactly the missing condition, and 731548''s offered wording is ''AAT restricts to deterministic encoders, for which the chain is automatic; the kernel-level theorem applies under the open-loop pi_cont convention''. The same source adds that what is exact is only the objective, since Tishby''s convergence proof ''does not imply uniqueness'' (:278), so phi* = argmin presumes uniqueness. Also carried, with the beta-versus-volatility contradiction in the same segment, by item influx-ib-beta-rho-and-exactness; take both together.'
