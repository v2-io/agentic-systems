text: 'A cue-driven read of the in-context record exists in logogenic agents and has a published retrieved-context characterization: induction heads are CMR-like (arXiv 2405.14992, NeurIPS 2024; the two notes give the first author as Li and as Ji-An, take it from the arXiv record) and seq2seq attention corresponds to CMR reinstatement (Salvatore & Zhang 2025, Communications Psychology, doi 10.1038/s44271-025-00322-6). Scope: within the window, short lags (2-4 tokens in GPT-2 small), not an archive outside it; #the-reality-model-intro WN line 61 already calls the window ~C_t. LLM ''consolidation'' names four operations (text-store merging, token merging, distillation into weights, offline precomputation); under #form-consolidation-dynamics''s definition only distillation updates M^slow, text-store merging rewrites the untyped external store, and precomputation is not consolidation.'
