text: 'An unselfconscious in-order walk of the whole of Volume 1, the kind the pedagogy memory prefers to commissioned intros. Its reader flags are in 000-supplement-notes.md and are disposed in drain/msc.md. The summaries themselves are stale against canon and some now state refuted claims: 054-def-strategy-dag.md says AND/OR propagation is correct ''if and only if'' the DAG is causally sufficient, which C.1/A1 deleted (33bf185d; exact iff an AND/OR tree), and the walk predates the Model S window, the typed target and the retirement of the ambiguity factor. Any sentence lifted from it needs its own check against canon at the time of lifting, as with the aat-refactored pedagogy already noted here.'
