text: 'Correction to my wording: the clause at #result-adversarial-exponent-regimes:18 ''without changing tempo or gain'' is not false as written. It describes the lever (noise, not a tempo or gain change), and under fixed gain it is literally true. The defect is F226''s: the defense is presented as cheap while the framework''s own machinery (#emp-update-gain; higher U_o lowers the defender''s optimal gain, and its tempo and persistence margin with it) says the defender pays. Read it as one-sided, concealing the cost, not as a false clause.'
