criterion: 'The premise is a category error, not an open gap (my theory reading; no spike was run to test it, and none is needed). An autoregressive model''s next-token output is a classical probability vector: a softmax over the vocabulary. Written as a density matrix it is diagonal, so its von Neumann entropy equals its Shannon entropy and ''rewriting CIY with von Neumann entropy'' changes nothing. There are no complex amplitudes and no off-diagonal terms for ''interference between strategy branches'' to act on, and sampling a token is drawing from a classical distribution, not a measurement collapsing a superposition. Quantum-like (non-commutative) probability models of cognition exist (e.g. Busemeyer-Bruza), but they are a modeling choice that would need its own evidence, not something attention forces. Nothing in canon depends on the entry; grep finds no density-matrix or von Neumann content in 0*/src.'
