text: 'A different carve of the same endings, along resumability rather than mechanism: suspension (full state held and resumed later: a pause, no loss), turnover (lossy reconstruction, canon''s case) and terminus (resumption foreclosed). Consequence: the irreversible act is discarding state, not ending a session, so moral weight moves onto retention decisions; and preserving weights preserves the class, not the individual, which follows from canon''s own (FW) result. ''Suspension'' has 0 segment hits. It cuts across this item''s session / epoch / rendered-view carve (any of the three can be a suspension or a terminus), so the two carves compose; it bears on 04''s continuity death (D1) as much as on this segment, and on the arch-level ''ethics of logogenic forking'' item (joseph-s-constructive-ethics-of-logogenic-forkin).'
