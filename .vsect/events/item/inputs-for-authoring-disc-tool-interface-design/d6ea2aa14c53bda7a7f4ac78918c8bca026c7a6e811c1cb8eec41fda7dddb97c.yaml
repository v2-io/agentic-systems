source: 'udon TST-extension-memo §6 (read whole): the corpus''s bridge chapters are multi-claim expositions, and each carries a leg-table (one row per constituent claim with kind, strength, repair) intended as a split manifest, so claims can be extracted into ordinary one-claim segments without re-reading the prose. That table is the work order for this landing; §6(a)''s proposed ''demand'' type (''the evidence says a tool must provide X'', discharged by being met) is how most rows would type, and asf has no such type, so those rows likely stay in udon while theory-bearing rows land. §7''s ''# is a canonicity marker, reserved for canonical segments'' is a convention the landing should keep.'
text: how the corpus can be carved for landing, from its own authors
