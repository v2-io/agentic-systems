text: 'Additions at dc2b262c: (1) before the learned-helplessness analogy is claimed, read Maier & Seligman 2016 (''Learned helplessness at fifty'', Psychological Review; from training, unread here), which argues the original mechanism was backwards (passivity is the default; control is learned), so Result 4''s credence-learning mechanism may differ from the phenomenon it is likened to. (2) def-death-as-factor-loss WN''s standing cross-check, mapping PROPRIUM-ARCHITECTURE-v2 §8''s nine failure modes onto factor-losses, is not in this item. (3) The owner review finds the generation looser than claimed: D1''s mechanisms (persistence failure, turnover decay) neither fork nor break the trajectory that factor (i) defines, and D4''s core mechanism (gain collapse) is calibration, not the accountability of factor (iv).'
