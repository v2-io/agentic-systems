source: 'Literature map for all three legs (influx drain 2, periphery): ~/src/scheduling-tech/ref/formal-theory.md (779 lines, 2026-10-24/27) answers eleven formal questions: commitments as a typed lifecycle (Winograd and Flores'' Conversation for Action, 1986; Sull and Spinosa 2007), sequencing (Smith''s rule, Gittins, cost of delay), preemption costs (expected completion (1/lambda + D)(e^{lambda T} - 1) under preempt-repeat, linear under preempt-resume; Young/Daly checkpointing), present bias and personal rules (O''Donoghue and Rabin; Ainslie). None of these names appears in canon. Its emergency-department case (KC, Staats, Kouchaki and Gino 2020: shortest-job-first optimal for the measured objective; the error is in the objective) is a field instance of the satisfaction-gap vs control-regret split, with a provenance flag the source notes (a co-author''s later misconduct finding). Relayed in msc/inside-out-2026-10/influx-scout/periphery.md §6.'
