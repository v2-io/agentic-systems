source: 'AISI sweep-2 R44 §2 (/Users/josephwecker-v2/src/AISI-responses/influx/sweep-2-raw/report-44.md): why closing TST-7 matters beyond TST: a computable sufficiency criterion separates two incident classes, an implementer that could not distinguish the intended behaviour from what it did (specification failure) and one given sufficient information that deviated anyway. The audits drain (drain/audits.md row on 829314/05, 193847/74) found the body now carries the (S1) distinguishability premise; the posterior-mass threshold is still open.'
