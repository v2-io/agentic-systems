text: 'Correction: the ''why'' says the SOP carries ''all six points''. Five of six. The sixth, ''No prose-cited side list for v1'' (do not build a parallel curated list of prose-cited works; the bibliography is driven by formal cite commands), is a v1 scoping note that doc/sop/format.sop.md does not state, though line 84''s ''prose alone does not put a source in the bibliography'' implies it. The outcome (landed) stands: the rule itself, which is what deleting BIBLIOGRAPHY-TODO had to preserve, is in the SOP.'
