source: 'Inbound side of the same question (drain-influx-2-firmatum): other Archema members already cite asf segments across the volume boundary, in two dialects: vivarium uses #asf/1-aat/<slug>, #asf/3-llm/, #asf/4-eli/ (ETHICS.md, core/src); udon''s tooling corpus and tst-grounding use #asf/aat/, #asf/llm/, #asf/tst/ (count by grep over vivarium, udon-needs, verisectorium/theory/src, logos: 23 + 5 + 3 in the numbered form, 6 + 6 in the bare form, plus #asf/tst/ in tst-grounding). udon''s TST-extension memo (~/src/arch/firmatum/udon/v2/udon-needs/02-tooling-needs/notes/TST-extension-memo.md, item 7) proposed #asf/{aat,tst,llm,eli}/slug to asf''s maintainers; verisectorium''s CHANGELOG lists the divergence as open. asf''s own slugs are unique across volumes, so the volume part is a reader''s aid, not part of the identity; a decision here could name one inbound form for the charter (§9) to adopt. address-theory (~/src/address-theory/def/def-binding.ud, def-resolution.ud) has the vocabulary (binding, dangle, collide; designator vs description) that verisectorium RC1 11-LEXICAL-CORE adopted.'
text: the in-build rendering decision and the inbound dialect are one addressing decision
