criterion: 'Real redefinition (A7): the state delta of the sector condition is now the estimation error, not the innovation. The F72 checks it re-binds do not read that distinction. F72#C1 (EA.1) bounds the mean lag m = E[p_hat] - theta, which the proof computes directly from the estimator class; that is already the mean estimation error, and it equals the mean innovation because the channel noise has mean zero given state and law. F72#C2 measures the same mean lag by the y -> theta substitution. F72#C3 is gain and count algebra on the update rule, which is driven by the innovation before and after. Where they are listed: example-bandit#C7 computes Gaussian-prior information quantities, schema#C4 greps for (1-lambda)/(2-lambda) carriers, and vol4#C1/C2 concern auxilia alignment and the PROPRIUM mapping. None of these reads what the persistence dynamics state is, or the gain-injected disturbance term.'
