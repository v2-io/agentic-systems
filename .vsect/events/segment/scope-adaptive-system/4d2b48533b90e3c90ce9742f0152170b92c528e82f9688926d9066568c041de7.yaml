text: 'Correction by the finding''s author: the absolute-continuity step runs only after the first observation, since o_1 = Omega_1 and pi_0 is a joint law of (Omega_1, theta). The condition should read ''atomless law under pi_0 given the initial state'' (or assume pi_0 makes Omega_1 independent of theta, as the linear-Gaussian example does). Counterexample to the version as taken: Omega_1 ~ U(0,1), theta = g(Omega_1) with g injective; atomless dominated rows, yet o_1 fixes theta. The corrected text is in spikes/epistemic-target-ontology/17-check-8.md F1.'
