text: Yes, with a price, derived in def-auxilia-hierarchy Discussion (What earns the structural bound). Whatever is in a belief-side call's context is part of q_M, so AXIOMATA's objective layer enters I(q_M; G^op). The W1 bound stays structural, provided the Auxilia's pre-call state is goal-free per (C2′), but it is loosened by the goal information that layer carries. Receiving only AXIOMATA's self-description keeps it tight. Neither H1 nor the W1 realization is false; the segment now names the tradeoff as a design choice. A persistent Auxilia that has received goal content fails (C2′) outright.
