text: 'Not as a fork of the agent that carries the store, but yes at the level of sessions. The criterion now in #scope-agent-identity is ordinal: two continuations of one state are a fork when each takes events after the other has begun (side by side or in turn). Two sessions reading and writing one store at once are two continuations of it, so as sessions they are two agents whose writes merge lossily through the store (consequence 2); the store-carrying system is one agent only as a composite of them (#scope-composite-agent). Landed in the body''s logogenic paragraph, round-2 Vol-4 C.1 batch 1.'
