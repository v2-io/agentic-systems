text: 'Partly, and the rest is narrowed. The 3/2 law is derived at fixed noise intensity; with the self-injected channel noise included, a linear corrector''s steady state is (sigma_i^2 + T_i^2 s_nu,i^2)/(2 T_i), so the coupling-dominant derivation needs the coupling noise to dominate each agent''s own injected noise (gamma_A T_A >> T_B s_nu,B and gamma_B T_B >> T_A s_nu,A); the second fails for a gain-raised tempo ratio above about gamma_B/s_nu,A, where the attacker''s error is set by its own injected noise and its advantage stops growing. That scope condition is landed in #result-adversarial-tempo-advantage and pointed to from #result-adversarial-exponent-regimes (a728475f). Not done, and recorded as finding F1 of reviews/part-i-round-2-integration.md: the regime map under sigma_w(alpha), whether pushing a target''s gain out of its window from above is a distinct regime, and the per-dimension / matrix-Loewner / discrete Model S results under the total disturbance (exact at fixed disturbance; reading changes). Reopen if those are taken up.'
